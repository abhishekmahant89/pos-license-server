services:
  - type: web
    name: pos-license-server
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_PATH
        value: /app/Data/licenses.db
    disk:
      name: license-data
      mountPath: /app/Data
      sizeGB: 1
