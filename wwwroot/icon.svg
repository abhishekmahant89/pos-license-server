<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1E293B" stroke-width="4"/>
  <circle cx="256" cy="256" r="185" fill="#162032" stroke="#38BDF8" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Central Shield -->
  <path d="M256 100 L380 155 C380 295 256 385 256 385 C256 385 132 295 132 155 Z" 
        fill="url(#shieldGrad)" stroke="#7DD3FC" stroke-width="4"/>
        
  <!-- Inner Keyhole / Lock Badge -->
  <path d="M256 160 C236 160 220 176 220 196 C220 209 227 220 238 226 L230 290 L282 290 L274 226 C285 220 292 209 292 196 C292 176 276 160 256 160 Z"
        fill="#FFFFFF" opacity="0.95"/>
        
  <!-- Text Label -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="3">POS HUB</text>
</svg>
